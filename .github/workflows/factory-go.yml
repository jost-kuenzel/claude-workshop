name: factory-go
on:
  issues:
    types: [labeled]

concurrency:
  group: factory-go-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  build:
    if: |
      github.event.label.name == 'factory-go' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
      # OS sandbox backend for the Claude steps. Needs bubblewrap (process/fs isolation)
      # + socat (localhost network proxy). On ubuntu-24.04 the default AppArmor policy
      # (kernel.apparmor_restrict_unprivileged_userns=1) blocks bwrap from configuring
      # its network namespace's loopback (RTM_NEWADDR EPERM), so relax it for this
      # ephemeral runner. Without this the sandbox can't init and commands fail closed.
      - run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: bun install --frozen-lockfile
      # Install the chromium browser (+ OS deps) so the frontend-verify skill can
      # drive a headless browser against the frontend during the Claude steps.
      # PLAYWRIGHT_BROWSERS_PATH points inside the workspace so the browser AND the
      # playwright-cli daemon's working dir ($PLAYWRIGHT_BROWSERS_PATH/daemon) live on
      # a path that stays writable inside the OS sandbox. The default
      # ~/.cache/ms-playwright is mounted read-only in the sandbox, which previously
      # killed the daemon (`mkdir .../daemon: Read-only file system`). Set in
      # $GITHUB_ENV so both the install step and the sandboxed Claude steps inherit it.
      - run: echo "PLAYWRIGHT_BROWSERS_PATH=$GITHUB_WORKSPACE/.playwright-browsers" >> "$GITHUB_ENV"
      - run: bunx playwright-cli install-browser chromium --with-deps
      - run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun tools/factory/workflow-go.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-logs-${{ github.run_id }}
          path: .factory/logs/
