name: factory-revise
on:
  issue_comment:
    types: [created]

concurrency:
  group: factory-revise-pr-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  revise:
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/factory-revise') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/jost-kuenzel/claude-workshop-devcontainer:latest
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add=NET_ADMIN --cap-add=NET_RAW --user 1000
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: read
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      # issue_comment events don't expose the PR head branch, so resolve it from
      # the PR and check that branch out by name. Checking out refs/pull/N/head
      # leaves a detached HEAD, from which `git push` cannot update the branch —
      # the revise commit would be silently stranded.
      - id: prbranch
        run: echo "name=$(gh pr view "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.prbranch.outputs.name }}
      - run: sudo /usr/local/bin/init-firewall.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: bun install --frozen-lockfile
      - run: bun tools/factory/workflow-revise.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-logs-${{ github.run_id }}
          path: .factory/logs/
