name: factory-revise
on:
  issue_comment:
    types: [created]

concurrency:
  group: factory-revise-pr-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  revise:
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/factory-revise') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      # issue_comment events don't expose the PR head branch, so resolve it from
      # the PR and check that branch out by name. Checking out refs/pull/N/head
      # leaves a detached HEAD, from which `git push` cannot update the branch —
      # the revise commit would be silently stranded.
      - id: prbranch
        run: echo "name=$(gh pr view "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.prbranch.outputs.name }}
      - uses: oven-sh/setup-bun@v2
      # OS sandbox backend for the Claude steps. Needs bubblewrap (process/fs isolation)
      # + socat (localhost network proxy). On ubuntu-24.04 the default AppArmor policy
      # (kernel.apparmor_restrict_unprivileged_userns=1) blocks bwrap from configuring
      # its network namespace's loopback (RTM_NEWADDR EPERM), so relax it for this
      # ephemeral runner. Without this the sandbox can't init and commands fail closed.
      - run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: bun install --frozen-lockfile
      # Install the chromium browser (+ OS deps) so the frontend-verify skill can
      # drive a headless browser against the frontend during the Claude steps.
      # PLAYWRIGHT_BROWSERS_PATH points inside the workspace so the browser AND the
      # playwright-cli daemon's working dir ($PLAYWRIGHT_BROWSERS_PATH/daemon) live on
      # a path that stays writable inside the OS sandbox. The default
      # ~/.cache/ms-playwright is mounted read-only in the sandbox, which previously
      # killed the daemon (`mkdir .../daemon: Read-only file system`). Set in
      # $GITHUB_ENV so both the install step and the sandboxed Claude steps inherit it.
      - run: echo "PLAYWRIGHT_BROWSERS_PATH=$GITHUB_WORKSPACE/.playwright-browsers" >> "$GITHUB_ENV"
      - run: bunx playwright-cli install-browser chromium --with-deps
      - run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun tools/factory/workflow-revise.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-logs-${{ github.run_id }}
          path: .factory/logs/
